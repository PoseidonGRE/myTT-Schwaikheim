<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>🏓 MyTT-Schwaikheim – Tischtennis Vereinssoftware</title>
  <meta name="description" content="MyTT-Schwaikheim: Die smarte Tischtennis-Software für deinen Verein. Mitglieder, Training, Spieltage & mehr, alles in einer modernen App!" />
  <meta name="theme-color" content="#eaf2fb" />

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="MyTT-Schwaikheim – Tischtennis Vereinssoftware" />
  <meta property="og:description" content="Die innovative All-in-One-Lösung für den Tischtennisverein Schwaikheim." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:url" content="https://ttv-schwaikheim.de/app" />
  <meta property="og:type" content="website" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MyTT-Schwaikheim – Tischtennis Vereinssoftware" />
  <meta name="twitter:description" content="Die smarte Tischtennis-App für den TTV Schwaikheim." />
  <meta name="twitter:image" content="/og-image.png" />

  <!-- Favicon & Touch Icons -->
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Fonts & Material Icons (Google Fonts) -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Splashscreen-Style, solange React lädt -->
  <style>
    :root {
      --primary: #247be7;
      --accent: #3de6b5;
      --soft-bg: #f6fafd;
      --card-shadow: 0 4px 24px 0 rgba(36,123,231,0.06);
      --splash-text: #222;
      --accent-bg: linear-gradient(90deg, #eaf2fb 0%, #f6fafd 100%);
    }
    body {
      background: var(--accent-bg);
      margin: 0;
      font-family: 'Roboto', Arial, sans-serif;
      color: #222;
      min-height: 100vh;
    }
    #root:empty::before {
      content: "🏓 MyTT-Schwaikheim lädt ...";
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 2.3rem;
      color: var(--primary);
      font-weight: bold;
      letter-spacing: 0.03em;
      background: var(--accent-bg);
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      border-radius: 0 0 32px 32px;
      box-shadow: var(--card-shadow);
      box-sizing: border-box;
      transition: background 0.4s;
    }
    @media (max-width: 600px) {
      #root:empty::before {
        font-size: 1.5rem;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <noscript>Bitte aktiviere JavaScript, um MyTT-Schwaikheim zu nutzen.</noscript>
  <div id="root"></div>
  <script src="/bundle.js"></script>
</body>
</html>
